name: Test Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-por poppler-utils
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check Python syntax
      run: |
        python -m py_compile server.py
        python -m py_compile analyze_with_openai.py
        python -m py_compile extract_ocr.py
        python -m py_compile fill_template.py
    
    - name: Test Docker build
      run: |
        docker build -t test-app .
    
    - name: Test Docker run (health check)
      run: |
        docker run -d --name test-container -p 8000:8000 \
          -e OPENAI_API_KEY=sk-test \
          -e FIREBASE_PROJECT_ID=test-project \
          -e FIREBASE_SERVICE_ACCOUNT='{"type":"service_account"}' \
          test-app
        
        # Wait for container to start
        sleep 10
        
        # Check if health endpoint responds
        curl -f http://localhost:8000/api/health || exit 1
        
        # Cleanup
        docker stop test-container
        docker rm test-container

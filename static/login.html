<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Horlando Braga</title>
    <link rel="icon" type="image/png" href="/static/imgs/flavicon horlando.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <img src="/static/imgs/horlando braga.png" alt="Horlando Braga" class="logo" />
        
        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="seuemail@dominio.com" 
              required 
              autocomplete="email"
            />
          </div>
          
          <div class="form-group">
            <label for="password">Senha</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            />
          </div>
          
          <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
          
          <div class="status" id="status"></div>
        </form>
      </div>
    </div>

    <script type="module" src="/static/login.js"></script>
  </body>
</html>

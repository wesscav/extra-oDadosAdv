<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extração de dados (PDF → DOCX)</title>
    <link rel="icon" type="image/png" href="/static/imgs/flavicon horlando.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header-content">
          <div>
            <h1>Extração de dados</h1>
          </div>
          <button class="logout-icon-btn" type="button" id="logoutBtn" aria-label="Sair" title="Sair">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M10 17v-2h4v-6h-4V7l-5 5 5 5zm-7 4q-.825 0-1.413-.588T1 19V5q0-.825.588-1.413T3 3h8v2H3v14h8v2H3zm14-4l-1.4-1.4L17.2 14H9v-2h8.2l-1.6-1.6L17 9l5 5-5 5z"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="card">
        <form id="uploadForm">
          <label class="label" for="files">Selecione os arquivos</label>
          <div
            class="dropzone"
            id="dropzone"
            role="button"
            tabindex="0"
            aria-describedby="fileHelp"
            aria-label="Arraste e solte os arquivos PDF aqui, ou clique para selecionar"
          >
            <div class="dropzone-title">Arraste e solte os PDFs aqui</div>
            <div class="dropzone-subtitle">ou clique para selecionar</div>
          </div>
          <input class="file-input-hidden" id="files" name="files" type="file" accept="application/pdf" multiple required />
          <div class="help" id="fileHelp">Nenhum arquivo selecionado.</div>

          <div class="row">
            <button class="btn btn-primary" type="submit" id="submitBtn">Extrair e resumir</button>
          </div>

          <div class="status" id="status"></div>
        </form>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Confirme os dados extraídos</h2>
          <button class="icon-btn" id="closeModalBtn" aria-label="Fechar">✕</button>
        </div>

        <div class="modal-body">
          <div class="pill-row" id="perDocInfo"></div>

          <h3>Resumo</h3>
          <div class="summary" id="summary"></div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-ghost" id="cancelBtn" type="button">Cancelar</button>
          <button class="btn btn-primary" id="confirmBtn" type="button">Confirmar e gerar .docx</button>
        </div>
      </div>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extração de dados (PDF → DOCX)</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Extração de dados</h1>
        <p>Envie <strong>4 PDFs</strong>. Vamos extrair, mostrar um resumo para você confirmar, e então gerar o <strong>.docx</strong>.</p>
      </header>

      <section class="card">
        <form id="uploadForm">
          <label class="label" for="files">Selecione 4 arquivos PDF</label>
          <input id="files" name="files" type="file" accept="application/pdf" multiple required />
          <div class="help" id="fileHelp">Nenhum arquivo selecionado.</div>

          <div class="row">
            <button class="btn btn-primary" type="submit" id="submitBtn">Extrair e resumir</button>
            <button class="btn btn-ghost" type="button" id="clearBtn">Limpar</button>
          </div>

          <div class="status" id="status"></div>
        </form>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Confirme os dados extraídos</h2>
          <button class="icon-btn" id="closeModalBtn" aria-label="Fechar">✕</button>
        </div>

        <div class="modal-body">
          <div class="pill-row" id="perDocInfo"></div>

          <h3>Resumo</h3>
          <div class="summary" id="summary"></div>

          <details class="details">
            <summary>Ver JSON completo (estruturado)</summary>
            <pre class="json" id="structuredJson"></pre>
          </details>
        </div>

        <div class="modal-footer">
          <button class="btn btn-ghost" id="cancelBtn" type="button">Cancelar</button>
          <button class="btn btn-primary" id="confirmBtn" type="button">Confirmar e gerar .docx</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
